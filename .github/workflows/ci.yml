name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Next 16 generates route types into .next/types; bare `tsc --noEmit`
      # only passes locally because a build already ran (found the hard way
      # on tikanmaanhuoltoasema.com's first CI run).
      - run: npm run typecheck

      # Content invariants: real business facts, all 8 services and 8
      # industries present in all three locales, no locale carrying another
      # locale's prose, no dashes in prose. Also runs the placeholder guard's
      # self-test, which proves the guard still catches a planted positive.
      - run: npm test

      - run: npm run build

      # Structural check of the 99-route export: lang, canonical, hreflang,
      # H1, titles, descriptions, contact details, asset existence (including
      # the share-card images, which live in meta content= rather than src=),
      # sitemap count, and that the offline Techverxe case is not emitted as a
      # live link. Proven to fail on planted defects.
      - run: npm run verify

      # Release gate. This is a REAL gate here, unlike in the starter kit this
      # repo came from: that one shipped with every business fact as a
      # PLACEHOLDER_ sentinel, so a full scan could never be green and the job
      # had to be advisory. Every fact on this site is real, the scan is clean,
      # and so it now blocks a merge rather than printing a warning nobody
      # reads. If this goes red, supply the real value; do not weaken the check.
      - run: npm run guard

      # The responsive sweep. This existed and was passing locally since the
      # day it was written, but ran nowhere: the project documented four gates
      # while CI enforced three, so the two defects it was built to catch (a
      # permanently-open mobile menu, and a minmax(300px) floor forcing 348px
      # of content into a 320px screen) could both come back green.
      #
      # It drives a real browser at 22 widths across 7 page types, so it needs
      # Chromium and the export actually served. The browser is cached, which
      # keeps the added time to a download only on a version bump.
      - name: Cache the Chromium build
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # The sweep serves out/ itself on an ephemeral port. CI used to start a
      # python server on 4010 and wait for it, which is the ambient dependency
      # that let the sweep silently measure a DIFFERENT worktree's build on a
      # developer machine. Priming that port here would keep the misleading
      # shape alive in the one place people read to learn how the gate runs.
      - run: npm run sweep

      # Rendered-page invariants. Separate from the sweep because the sweep
      # asks "does anything overflow" and this asks "is this specific element
      # actually on screen". The footer shipped with every card heading
      # clipped while all five other gates were green.
      - run: npm run render
