# Static export served directly by nginx. Every path is a plain file: there is
# no application process, nothing to restart, nothing to patch at runtime, and
# no application-layer attack surface beyond the files themselves.
#
# Pages are locale-prefixed (/fi/, /sv/, /en/). A bare path is redirected to
# the Finnish default rather than 404'd; see the routing section below.
#
# Installed to /etc/nginx/sites-available/stellarstack.fi

server {
    listen 80;
    listen [::]:80;
    server_name stellarstack.fi www.stellarstack.fi;

    # certbot writes its challenge here; everything else goes to TLS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://stellarstack.fi$request_uri;
    }
}

# www -> apex, so there is exactly one canonical host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.stellarstack.fi;

    ssl_certificate     /etc/letsencrypt/live/stellarstack.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellarstack.fi/privkey.pem;
    # Explicit TLS settings rather than certbot's include: `certonly --webroot`
    # does not create options-ssl-nginx.conf, so depending on it makes the
    # config fail on a box where only the certificate was issued.
    # Mozilla "intermediate": TLS 1.2 + 1.3, ECDHE only, no dhparam needed.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/security.conf;
    return 301 https://stellarstack.fi$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stellarstack.fi;

    root /var/www/stellarstack.fi/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/stellarstack.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellarstack.fi/privkey.pem;
    # Explicit TLS settings rather than certbot's include: `certonly --webroot`
    # does not create options-ssl-nginx.conf, so depending on it makes the
    # config fail on a box where only the certificate was issued.
    # Mozilla "intermediate": TLS 1.2 + 1.3, ECDHE only, no dhparam needed.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- security headers ----
    include /etc/nginx/snippets/security.conf;

    server_tokens off;
    autoindex off;

    # ---- compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml font/woff2;

    # ---- caching ----
    # Fingerprinted build assets are immutable.
    location /_next/static/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }
    location /brand/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }
    # HTML must revalidate, or a deploy is invisible to returning visitors.
    location ~* \.html$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
    location = /sitemap.xml {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /robots.txt {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }


    # ---- routing ----
    # Finnish is the default locale here; swap if the new client's default
    # locale differs. The bare domain lands on it.
    location = / {
        return 302 /fi/;
    }

    # The export writes directory/index.html, so a clean URL resolves without
    # exposing the .html extension. Real files (favicon.svg, brand artwork,
    # and anything else at the export root) are tried FIRST and always
    # win; only a path matching nothing at all falls through to @localize.
    location / {
        try_files $uri $uri/ $uri/index.html @localize;
    }

    # Every real PAGE lives under /fi/, /sv/ or /en/; this export has no
    # server runtime to redirect a bare, locale-less path the way Next's own
    # i18n middleware would, so one would otherwise 404 outright. Found live
    # on the source project this was extracted from: a generated link was
    # emitted without its locale prefix and 404'd for every customer. This
    # is the backstop for that failure class anywhere it recurs.
    #
    # Reached only when try_files above found no matching file, directory,
    # or index - a root-level static asset is resolved by try_files before
    # ever reaching here, so it can never be wrongly rewritten (the bug an
    # earlier, path-prefix-matching version of this pattern had: it caught
    # /favicon.svg and the brand SVGs and 404'd them). Keep this pattern
    # try-then-fallback, never an exclusion-list-shaped `if`.
    location @localize {
        rewrite ^/(.*)$ /fi/$1 redirect;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # never serve dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
