# Static export served directly by nginx, with ONE deliberate exception:
# /api/booking/ proxies to a small Node service (see booking.service) for
# the online booking feature. Every other path is still a plain file, nothing
# to restart, nothing to patch at runtime, no application-layer attack surface
# beyond the files themselves.
#
# Installed to /etc/nginx/sites-available/example-client.com

server {
    listen 80;
    listen [::]:80;
    server_name example-client.com www.example-client.com;

    # certbot writes its challenge here; everything else goes to TLS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://example-client.com$request_uri;
    }
}

# www -> apex, so there is exactly one canonical host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example-client.com;

    ssl_certificate     /etc/letsencrypt/live/example-client.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example-client.com/privkey.pem;
    # Explicit TLS settings rather than certbot's include: `certonly --webroot`
    # does not create options-ssl-nginx.conf, so depending on it makes the
    # config fail on a box where only the certificate was issued.
    # Mozilla "intermediate": TLS 1.2 + 1.3, ECDHE only, no dhparam needed.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/security.conf;
    return 301 https://example-client.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example-client.com;

    root /var/www/example-client.com/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/example-client.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example-client.com/privkey.pem;
    # Explicit TLS settings rather than certbot's include: `certonly --webroot`
    # does not create options-ssl-nginx.conf, so depending on it makes the
    # config fail on a box where only the certificate was issued.
    # Mozilla "intermediate": TLS 1.2 + 1.3, ECDHE only, no dhparam needed.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- security headers ----
    include /etc/nginx/snippets/security.conf;

    server_tokens off;
    autoindex off;

    # ---- compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml font/woff2;

    # ---- caching ----
    # Fingerprinted build assets are immutable.
    location /_next/static/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }
    location /img/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }
    # HTML must revalidate, or a deploy is invisible to returning visitors.
    location ~* \.html$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
    location = /sitemap.xml {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /robots.txt {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }
    # Root-level, not locale-scoped, same as sitemap.xml/robots.txt above.
    # `location /`'s try_files already resolves this correctly on its own;
    # this exact block exists only to give it the same caching header as
    # its two siblings, for consistency.
    location = /llms.txt {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ---- booking API ----
    # The one path proxied to a live process instead of served as a file.
    # No CSP change needed: security.conf already scopes connect-src to
    # 'self', which covers same-origin fetch() calls to this path.
    # NO trailing slash on the prefix: server/index.mjs's own POST route is
    # the bare path "/api/booking" (no trailing slash), and an nginx prefix
    # location WITH a trailing slash does not match a request missing it.
    # This form matches both "/api/booking" and "/api/booking/*".
    location /api/booking {
        include /etc/nginx/snippets/security.conf;
        # Small and JSON-only; matches server/index.mjs's own body-size cap
        # plus headroom, so an oversized request is rejected at the edge
        # rather than after establishing a connection to the Node process.
        client_max_body_size 32k;

        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Booking responses are per-request and must never be cached or
        # shared between visitors.
        add_header Cache-Control "no-store" always;
    }

    # ---- routing ----
    # Finnish is the default locale here; swap if the new client's default
    # locale differs. The bare domain lands on it.
    location = / {
        return 302 /fi/;
    }

    # The export writes directory/index.html, so a clean URL resolves without
    # exposing the .html extension. Real files (favicon.svg, llms.txt, and
    # anything else placed at the export root) are tried FIRST and always
    # win; only a path matching nothing at all falls through to @localize.
    location / {
        try_files $uri $uri/ $uri/index.html @localize;
    }

    # Every real PAGE lives under /fi/, /sv/ or /en/; this export has no
    # server runtime to redirect a bare, locale-less path the way Next's own
    # i18n middleware would, so one would otherwise 404 outright. Found live
    # on the source project this was extracted from: a booking cancel link
    # was generated as bare "/varaa/peru/?t=..." and 404'd for every
    # customer; that call site is fixed at the source (server/config.mjs's
    # cancelUrl()), this is the backstop for the same failure class anywhere
    # else, present or future.
    #
    # Reached only when try_files above found no matching file, directory,
    # or index - a root-level static asset is resolved by try_files before
    # ever reaching here, so it can never be wrongly rewritten (the bug an
    # earlier, path-prefix-matching version of this pattern had: it caught
    # /favicon.svg and /llms.txt and 404'd them both). Keep this pattern
    # try-then-fallback, never an exclusion-list-shaped `if`.
    location @localize {
        rewrite ^/(.*)$ /fi/$1 redirect;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # never serve dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
