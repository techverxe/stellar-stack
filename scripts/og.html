<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og-pending</title>
    <style>
      /* The real faces, from the same files the site ships, so the card is set
         in the brand's type rather than in whatever the renderer defaults to. */
      @font-face {
        font-family: "SS Sans";
        src: url("/src/fonts/inter_749a30.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: "SS Mono";
        src: url("/src/fonts/geistmono_013b2f.woff2") format("woff2");
        font-weight: 300 500;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #0c1216;
        font-family: "SS Sans", system-ui, sans-serif;
        color: #fff;
      }
      #field { position: absolute; inset: 0; z-index: 0; }
      .scrim {
        position: absolute; inset: 0; z-index: 1;
        background: linear-gradient(
          100deg,
          rgba(12, 18, 22, 0.92) 0%,
          rgba(12, 18, 22, 0.55) 46%,
          rgba(12, 18, 22, 0) 78%
        );
      }
      .card {
        position: relative; z-index: 2;
        height: 100%;
        padding: 68px 72px;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand img { width: 46px; height: 48px; }
      .word {
        font-family: "SS Mono", monospace;
        font-size: 21px; line-height: 1.05; font-weight: 500;
        letter-spacing: 0.2em; text-transform: uppercase;
      }
      .word span { display: block; }
      h1 {
        font-size: 78px; font-weight: 300; line-height: 1.06;
        letter-spacing: -0.016em; max-width: 15ch;
      }
      .foot {
        display: flex; align-items: baseline; gap: 20px;
        font-family: "SS Mono", monospace;
        font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase;
      }
      .dom { color: #83d6c4; }
      .sep { color: #4a5560; }
      .loc { color: #a8b1bc; }
    </style>
  </head>
  <body>
    <canvas id="field"></canvas>
    <div class="scrim"></div>
    <div class="card">
      <div class="brand">
        <img src="/public/brand/mark-white.svg" alt="" />
        <span class="word"><span>Stellar</span><span>Stack</span></span>
      </div>
      <h1 id="line">Verkkosivut jotka tuovat asiakkaita</h1>
      <div class="foot">
        <span class="dom">stellarstack.fi</span>
        <span class="sep">/</span>
        <span class="loc">Turku</span>
      </div>
    </div>

    <script>
      /*
       * The same point-cloud terrain the hero runs, rendered once as a still.
       * Kept in this file rather than imported from WaveField.tsx because that
       * component is a React client component driving an animation loop; this
       * needs one deterministic frame at a fixed size.
       */
      const c = document.getElementById("field");
      const W = 1200, H = 630, S = 2;
      c.width = W * S; c.height = H * S;
      c.style.width = W + "px"; c.style.height = H + "px";
      const g = c.getContext("2d");
      g.scale(S, S);

      const COLS = 190, ROWS = 108;
      const EYE = 430, HORIZON = H * 0.30;

      function height(u, v) {
        return (
          Math.sin(u * 3.1 + 0.7) * 0.55 +
          Math.sin(v * 2.3 - 0.4) * 0.42 +
          Math.sin((u + v) * 4.4) * 0.22 +
          Math.sin(u * 7.9 - v * 3.3) * 0.12
        );
      }

      for (let r = 0; r < ROWS; r++) {
        const v = r / (ROWS - 1);
        const depth = 1.05 + v * 8.2;
        for (let i = 0; i < COLS; i++) {
          const u = i / (COLS - 1);
          const wx = (u - 0.5) * 5.4;
          const hy = height(wx, v * 4.6);
          const px = W * 0.52 + (wx / depth) * EYE;
          const py = HORIZON + (EYE / depth) * 0.52 - hy * (86 / depth) * 2.1;
          if (px < -20 || px > W + 20 || py < 0 || py > H) continue;
          // Brightness from local slope, so crests catch the light.
          const slope = hy - height(wx + 0.06, v * 4.6);
          const lit = Math.min(1, Math.max(0, 0.42 + slope * 5.2));
          const fade = Math.min(1, (1 - v) * 1.5 + 0.12);
          const a = (0.1 + lit * 0.72) * fade;
          const size = Math.max(0.6, 2.0 / depth * 1.5);
          g.fillStyle =
            lit > 0.82
              ? `rgba(131,214,196,${a})`
              : `rgba(196,216,228,${a * 0.92})`;
          g.fillRect(px, py, size, size);
        }
      }

      /* One card per locale: the same image served to a Swedish or English
         reader in a Finnish share preview is the sort of detail that makes an
         outreach brand look machine-made. `?locale=` picks the line; the
         strings mirror home.headline + home.headlineAccent in each copy file
         and a test asserts they still match. */
      const LINES = {
        fi: "Verkkosivut jotka tuovat asiakkaita",
        sv: "Webbplatser som ger kunder",
        en: "Websites that bring customers",
      };
      const loc = new URLSearchParams(location.search).get("locale") || "fi";
      document.getElementById("line").textContent = LINES[loc] || LINES.fi;
      document.documentElement.lang = loc;

      document.fonts.ready.then(() => {
        document.title = "og-ready";
      });
    </script>
  </body>
</html>
